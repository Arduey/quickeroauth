<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}管理后台{% endblock %} · 授权管理系统</title>
<style>
  :root { --line:#e4e7ec; --ink:#1f2328; --muted:#6b7280; --brand:#2563eb;
          --ok:#15803d; --err:#b91c1c; --bg:#f5f6f8; --card:#fff; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:14px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif; }
  a { color:var(--brand); text-decoration:none; }
  a:hover { text-decoration:underline; }

  header.nav { background:#fff; border-bottom:1px solid var(--line); padding:0 20px;
               display:flex; align-items:center; gap:22px; flex-wrap:wrap; height:54px; }
  header.nav .brand { font-weight:700; }
  header.nav nav { display:flex; gap:16px; flex:1; flex-wrap:wrap; }
  header.nav nav a { color:var(--ink); font-size:13.5px; }
  header.nav .who { color:var(--muted); font-size:13px; }

  .wrap { max-width:1180px; margin:0 auto; padding:22px 16px 60px; }
  h1 { font-size:19px; margin:0 0 16px; }
  h2 { font-size:15px; margin:22px 0 10px; }
  .muted { color:var(--muted); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px;
          padding:18px 20px; }
  .card.narrow { max-width:380px; margin:8vh auto 0; }
  .grid2 { display:grid; grid-template-columns:1.4fr 1fr; gap:16px; align-items:start; }

  table { width:100%; border-collapse:collapse; background:var(--card);
          border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  th, td { text-align:left; padding:9px 12px; border-bottom:1px solid var(--line);
           font-size:13px; white-space:nowrap; }
  th { background:#fafbfc; color:var(--muted); font-weight:600; }
  tr:last-child td { border-bottom:0; }
  .table-scroll { overflow-x:auto; }

  label { display:block; margin-bottom:12px; font-size:13px; color:var(--muted); }
  input[type=text], input[type=password], input[type=number], select {
    display:block; width:100%; margin-top:4px; padding:8px 10px;
    border:1px solid var(--line); border-radius:6px; font-size:14px;
    color:var(--ink); background:#fff; }
  .row { display:flex; gap:10px; }
  .row > * { flex:1; }
  .inline { display:flex; gap:8px; align-items:flex-end; flex-wrap:wrap; }
  .inline label { margin-bottom:0; }

  button, .btn { display:inline-block; padding:8px 16px; border:0; border-radius:6px;
                 background:var(--brand); color:#fff; font-size:13.5px;
                 cursor:pointer; text-decoration:none; }
  button:hover, .btn:hover { opacity:.92; text-decoration:none; }
  button.plain, .btn.plain { background:#eef0f3; color:var(--ink); }
  button.danger, .btn.danger { background:#dc2626; }
  button.small, .btn.small { padding:5px 11px; font-size:12.5px; }

  .filters { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:14px; }
  .filters input[type=text] { width:260px; margin-top:0; }
  .filters select { width:auto; margin-top:0; }

  .flash { border-radius:6px; padding:10px 12px; margin-bottom:16px; font-size:13px; }
  .flash.ok { border:1px solid #bbf7d0; background:#f0fdf4; color:var(--ok); }
  .flash.err { border:1px solid #fecaca; background:#fef2f2; color:var(--err); }

  .tag { display:inline-block; padding:1px 8px; border-radius:999px; font-size:12px; }
  .tag.active { background:#dcfce7; color:#15803d; }
  .tag.expired { background:#fef3c7; color:#92400e; }
  .tag.disabled { background:#fee2e2; color:#b91c1c; }

  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; }
  .stat { background:var(--card); border:1px solid var(--line); border-radius:10px;
          padding:14px 16px; }
  .stat .num { display:block; font-size:24px; font-weight:700; }
  .stat .lbl { color:var(--muted); font-size:12.5px; }

  .pager { display:flex; gap:12px; align-items:center; margin-top:14px; color:var(--muted); font-size:13px; }
  hr { border:0; border-top:1px solid var(--line); margin:16px 0; }
  code { background:#eef0f3; padding:1px 5px; border-radius:4px; }
  @media (max-width:820px) { .grid2 { grid-template-columns:1fr; } }
</style>
</head>
<body>
{% if current %}
<header class="nav">
  <div class="brand">授权管理系统</div>
  <nav>
    <a href="{{ admin_base }}/">概览</a>
    <a href="{{ admin_base }}/accounts">授权账户</a>
    <a href="{{ admin_base }}/orders">核销记录</a>
    <a href="{{ admin_base }}/settings">站点设置</a>
    <a href="{{ admin_base }}/admins">管理员</a>
  </nav>
  <div class="who">{{ current }} · <a href="{{ admin_base }}/logout">退出登录</a></div>
</header>
{% endif %}

<main class="wrap">
  {% if ok %}<div class="flash ok">{{ ok }}</div>{% endif %}
  {% if error %}<div class="flash err">{{ error }}</div>{% endif %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
